<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <!-- iOS SAFE AREA -->
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
  >

  <title>Planner Pro</title>

  <meta
    name="description"
    content="Современный офлайн планировщик задач, заметок и проектов"
  >

  <meta name="theme-color" content="#667eea">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Planner Pro">

  <!-- Android -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Icons -->
  <link rel="manifest" href="./manifest.json">

  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <link rel="icon" type="image/png" sizes="96x96" href="./icon-96.png">

  <!-- Styles -->
  <link rel="stylesheet" href="./styles.css">

  <!-- Prevent automatic darkening on iOS -->
  <meta name="color-scheme" content="light dark">
</head>

<body data-theme="dark" data-accent="ocean">

  <!-- APP BACKGROUND -->
  <div class="app-bg"></div>

  <!-- APP -->
  <div class="app-shell">

    <!-- HEADER -->
    <header class="app-header">

      <div class="header-top">

        <div class="header-info">
          <h1 id="welcome-greeting">
            Добрый вечер
          </h1>

          <div id="welcome-date" class="header-date">
            —
          </div>
        </div>

        <div class="header-actions">

          <button
            class="icon-btn"
            id="search-open-btn"
            aria-label="Поиск"
          >
            🔍
          </button>

          <button
            class="icon-btn"
            id="settings-open-btn"
            aria-label="Настройки"
          >
            ⚙️
          </button>

        </div>

      </div>

      <!-- DASHBOARD PROGRESS -->
      <section class="dashboard-progress glass-card">

        <div class="dashboard-progress-top">

          <div>
            <div class="dashboard-progress-label">
              Прогресс дня
            </div>

            <div
              class="dashboard-progress-value"
              id="day-progress-value"
            >
              0%
            </div>
          </div>

          <div
            class="dashboard-progress-count"
            id="today-count"
          >
            0 задач
          </div>

        </div>

        <div class="progress-bar">
          <div
            class="progress-fill"
            id="day-progress-fill"
          ></div>
        </div>

      </section>

    </header>

    <!-- MAIN -->
    <main id="main-content" class="main-content">

      <!-- DASHBOARD -->
      <section
        class="view active"
        id="view-dashboard"
      >

        <div class="section-block">

          <div class="section-title-row">
            <h2>Ближайшие задачи</h2>

            <button
              class="text-btn"
              data-view-link="tasks"
            >
              Все
            </button>
          </div>

          <div
            id="dashboard-upcoming-tasks"
            class="task-list"
          ></div>

          <div
            id="dashboard-empty"
            class="empty-state hidden"
          >
            Нет задач
          </div>

        </div>

        <div class="section-block">

          <div class="section-title-row">
            <h2>Проекты</h2>

            <button
              class="text-btn"
              data-view-link="projects"
            >
              Все
            </button>
          </div>

          <div
            id="dashboard-projects"
            class="projects-scroll"
          ></div>

        </div>

        <div class="section-block">

          <div class="section-title-row">
            <h2>Закреплённые заметки</h2>

            <button
              class="text-btn"
              data-view-link="notes"
            >
              Все
            </button>
          </div>

          <div
            id="dashboard-notes"
            class="notes-grid"
          ></div>

        </div>

      </section>

      <!-- TASKS -->
      <section
        class="view"
        id="view-tasks"
      >

        <!-- TASK TABS -->
        <div
          class="tabs-scroll"
          id="tasks-tabs"
        >

          <button
            class="tab-btn active"
            data-tab="all"
          >
            Все
          </button>

          <button
            class="tab-btn"
            data-tab="today"
          >
            Сегодня
          </button>

          <button
            class="tab-btn"
            data-tab="upcoming"
          >
            Предстоящие
          </button>

          <button
            class="tab-btn"
            data-tab="completed"
          >
            Выполненные
          </button>

        </div>

        <!-- TASKS CONTENT -->
        <div
          class="tasks-content"
          id="tasks-content"
        >

          <div
            class="task-list"
            id="tasks-list"
          ></div>

          <div
            class="empty-state hidden"
            id="tasks-empty"
          >
            Нет задач
          </div>

        </div>

      </section>

      <!-- CALENDAR -->
      <section
        class="view"
        id="view-calendar"
      >

        <div class="glass-card calendar-card">

          <div class="calendar-header">

            <button
              class="calendar-nav-btn"
              id="calendar-prev"
            >
              ←
            </button>

            <div
              class="calendar-title"
              id="calendar-title"
            >
              Май 2026
            </div>

            <button
              class="calendar-nav-btn"
              id="calendar-next"
            >
              →
            </button>

          </div>

          <div
            class="calendar-grid"
            id="calendar-grid"
          ></div>

        </div>

      </section>

      <!-- NOTES -->
      <section
        class="view"
        id="view-notes"
      >

        <div class="notes-search-wrap">

          <input
            type="search"
            id="notes-search"
            class="glass-input"
            placeholder="Поиск заметок..."
            autocomplete="off"
          >

        </div>

        <div
          id="notes-list"
          class="notes-grid"
        ></div>

      </section>

      <!-- PROJECTS -->
      <section
        class="view"
        id="view-projects"
      >

        <div
          class="projects-list"
          id="projects-list"
        ></div>

      </section>

    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">

      <button
        class="bottom-nav-btn active"
        data-view="dashboard"
      >
        <span>🏠</span>
        <span>Главная</span>
      </button>

      <button
        class="bottom-nav-btn"
        data-view="tasks"
      >
        <span>✅</span>
        <span>Задачи</span>
      </button>

      <button
        class="bottom-nav-btn"
        data-view="calendar"
      >
        <span>📅</span>
        <span>Календарь</span>
      </button>

      <button
        class="bottom-nav-btn"
        data-view="notes"
      >
        <span>📝</span>
        <span>Заметки</span>
      </button>

      <button
        class="bottom-nav-btn"
        data-view="projects"
      >
        <span>📁</span>
        <span>Проекты</span>
      </button>

    </nav>

    <!-- FAB -->
    <button
      class="fab"
      id="fab"
      aria-label="Создать"
    >
      +
    </button>

    <!-- TOASTS -->
    <div id="toast-container"></div>

  </div>

  <!-- APP VERSION -->
  <div class="app-version">
    v2.0.0
  </div>

  <!-- APP -->
  <script type="module" src="./app.js"></script>

</body>
</html>
