<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

  <title>Planner Pro — Планировщик задач и заметок</title>
  <meta name="description" content="Планировщик задач и заметок с офлайн-работой">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json?v=1.0.0">
  <meta name="theme-color" content="#667eea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <meta name="application-name" content="Planner">
  <meta name="msapplication-TileColor" content="#667eea">
  <meta name="msapplication-TileImage" content="icons/icon-144.png?v=1.0.0">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96.png?v=1.0.0">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1.0.0">

  <!-- iOS Splash Screens -->
  <link rel="apple-touch-startup-image" href="splash/splash-640x1136.png?v=1.0.0" media="(device-width: 320px)">
  <link rel="apple-touch-startup-image" href="splash/splash-750x1334.png?v=1.0.0" media="(device-width: 375px) and (device-height: 667px)">
  <link rel="apple-touch-startup-image" href="splash/splash-828x1792.png?v=1.0.0" media="(device-width: 414px) and (device-height: 896px)">
  <link rel="apple-touch-startup-image" href="splash/splash-1125x2436.png?v=1.0.0" media="(device-width: 375px) and (device-height: 812px)">
  <link rel="apple-touch-startup-image" href="splash/splash-1242x2688.png?v=1.0.0" media="(device-width: 414px) and (device-height: 896px)">
  <link rel="apple-touch-startup-image" href="splash/splash-1536x2048.png?v=1.0.0" media="(device-width: 768px)">
  <link rel="apple-touch-startup-image" href="splash/splash-1668x2224.png?v=1.0.0" media="(device-width: 834px)">
  <link rel="apple-touch-startup-image" href="splash/splash-2048x2732.png?v=1.0.0" media="(device-width: 1024px)">

  <!-- Open Graph -->
  <meta property="og:title" content="Planner Pro">
  <meta property="og:description" content="Планировщик задач и заметок с офлайн-работой">
  <meta property="og:image" content="icons/og-image.png?v=1.0.0">
  <meta property="og:type" content="website">

  <!-- Styles (versioned) -->
  <link rel="stylesheet" href="styles.css?v=1.0.0">

  <!-- App version constant (used by SW update check) -->
  <script>
    window.APP_VERSION = '1.0.0';
    window.APP_BASE = '/PlannerPro/';
  </script>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen" class="splash-screen" role="status" aria-label="Загрузка приложения">
    <div class="splash-logo">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="4"/>
        <path d="M16 2v4M8 2v4M3 10h18"/>
        <path d="M9 15l2 2 4-4"/>
      </svg>
    </div>
    <div class="splash-title">Planner Pro</div>
    <div class="splash-spinner" aria-hidden="true"></div>
    <div class="splash-status" id="splash-status">Инициализация…</div>
  </div>

  <!-- App Root -->
  <div id="app" hidden>
    <!-- Side Navigation (desktop/tablet) -->
    <nav id="side-nav" class="side-nav glass-panel" aria-label="Основная навигация"></nav>

    <!-- Main Content -->
    <main id="main-content" role="main"></main>

    <!-- Bottom Navigation (mobile) -->
    <nav id="bottom-nav" class="bottom-nav glass-panel" aria-label="Навигация"></nav>

    <!-- FAB -->
    <button id="fab" class="fab" aria-label="Создать">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <!-- Modal / BottomSheet container -->
    <div id="modal-root"></div>

    <!-- Toast container -->
    <div id="toast-root" aria-live="polite"></div>
  </div>

  <!-- Scripts (versioned) -->
  <script src="db.js?v=1.0.0"></script>
  <script src="store.js?v=1.0.0"></script>
  <script src="utils.js?v=1.0.0"></script>
  <script src="icons.js?v=1.0.0"></script>
  <script src="components.js?v=1.0.0"></script>
  <script src="services.js?v=1.0.0"></script>
  <script src="views.js?v=1.0.0"></script>
  <script src="router.js?v=1.0.0"></script>
  <script src="app.js?v=1.0.0"></script>
  <script src="sw-register.js?v=1.0.0"></script>
</body>
</html>
