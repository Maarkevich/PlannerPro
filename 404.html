<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=./index.html">
  <script>
    // GitHub Pages SPA redirect: preserve the path
    var path = window.location.pathname;
    var base = '/PlannerPro';
    if (path.indexOf(base) === 0) {
      var route = path.slice(base.length);
      if (route && route !== '/') {
        window.location.replace(base + '/index.html#' + route);
      } else {
        window.location.replace(base + '/index.html');
      }
    } else {
      window.location.replace('./index.html');
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
